# Generic bot/Reader drop-in for mixed-version migration and rollback.
# Install once at okx-grid-.service.d/ and once at okx-position-reader.service.d/.
# No delay after the first 2.10 seconds of kernel uptime.
[Service]
ExecStartPre=/usr/bin/python3 -I -B -c "import math, time, sys; age=time.clock_gettime(time.CLOCK_BOOTTIME); sys.exit(1) if not math.isfinite(age) or age < 0 else None; delay=max(0.0, 2.10-age); time.sleep(delay) if delay else None; age=time.clock_gettime(time.CLOCK_BOOTTIME); sys.exit(0 if math.isfinite(age) and age >= 2.10 else 1)"
